name: Android Build & QA

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk-and-test:
    name: Compile Kotlin, KAPT, Unit Tests & Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          fi

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Run Unit Tests & Assemble Debug APK
        run: |
          set +e
          gradle testDebugUnitTest :app:assembleDebug --no-daemon > gradle_build.log 2>&1
          STATUS=$?
          cat gradle_build.log
          if [ $STATUS -ne 0 ]; then
            MSG=$( (grep -E '^(e: |w: .*error)' gradle_build.log | head -n 25; awk '/FAILURE:/,0' gradle_build.log | head -n 35) | tr '\n' '|' | sed 's/|/%0A/g' )
            echo "::error title=GradleFailure::${MSG}"
            exit $STATUS
          fi

      - name: Upload Life OS Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: life-os-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
