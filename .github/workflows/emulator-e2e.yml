name: Android Emulator E2E & Screenshots

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "docs/emulator-screenshots/**"
      - "releases/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator-e2e:
    name: Boot Android Emulator, Test All Tabs, Package APK & Capture OLED Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Run Unit Tests & Assemble Signed Installable APK
        run: gradle testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run E2E Smoke Test & Screenshot Capture on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run_emulator_e2e.sh

      - name: Package Verified APK & Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/LifeOS-OLED-120fps.apk
          sha256sum releases/LifeOS-OLED-120fps.apk > releases/LifeOS-OLED-120fps.apk.sha256
          ls -lh releases/
          TAG="v1.1.0-oled"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" releases/LifeOS-OLED-120fps.apk releases/LifeOS-OLED-120fps.apk.sha256 --clobber
          else
            gh release create "$TAG" \
              releases/LifeOS-OLED-120fps.apk \
              releases/LifeOS-OLED-120fps.apk.sha256 \
              --target "${{ github.ref_name }}" \
              --title "Life OS v1.1.0 — Studio OLED Edition (120 FPS Zero-GC + SQLCipher AES-256)" \
              --notes "APK Android compilado, assinado para instalação direta e validado em Emulador Android 13 (API 33) sem crashes."
          fi

      - name: Upload Emulator Screenshots & Verified APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-os-verified-bundle
          path: |
            docs/emulator-screenshots/*.png
            releases/LifeOS-OLED-120fps.apk
            releases/LifeOS-OLED-120fps.apk.sha256

      - name: Commit Verified APK & Real Emulator Screenshots to Branch
        run: |
          git config user.name "Life OS QA Bot"
          git config user.email "qa@lifeos.local"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git add docs/emulator-screenshots/*.png releases/LifeOS-OLED-120fps.apk releases/LifeOS-OLED-120fps.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m "release(apk): package verified LifeOS-OLED-120fps.apk & E2E screenshots [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
