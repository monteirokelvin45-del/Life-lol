name: Android Emulator E2E & Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator-e2e:
    name: Boot Android Emulator, Test All Tabs & Capture OLED Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run E2E Smoke Test & Screenshot Capture on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run_emulator_e2e.sh

      - name: Upload Emulator Screenshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-os-emulator-screenshots
          path: docs/emulator-screenshots/*.png

      - name: Commit Real Emulator Screenshots to Branch
        run: |
          git config user.name "Life OS QA Bot"
          git config user.email "qa@lifeos.local"
          git add docs/emulator-screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs(qa): add real Android emulator E2E screenshots [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
